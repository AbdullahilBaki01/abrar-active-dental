<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="chair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg)"/>
  
  <!-- Subtle Clinic Interior Grid & Windows -->
  <line x1="100" y1="80" x2="100" y2="520" stroke="#99f6e4" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <line x1="700" y1="80" x2="700" y2="520" stroke="#99f6e4" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- Clinic Floor -->
  <path d="M0 480 Q 400 460 800 480 L 800 600 L 0 600 Z" fill="#e2e8f0" opacity="0.6"/>

  <!-- Dental Unit Chair -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <rect x="360" y="440" width="110" height="40" rx="8" fill="#64748b"/>
    <path d="M400 370 L 430 370 L 420 440 L 390 440 Z" fill="#94a3b8"/>
    <!-- Seat & Backrest -->
    <path d="M260 380 Q 320 370 380 370 Q 430 370 470 340 L 450 310 Q 390 330 340 330 L 260 340 Z" fill="url(#chair)"/>
    <path d="M460 340 Q 520 290 560 210 Q 575 180 550 170 Q 525 160 510 190 Q 470 260 420 310 Z" fill="url(#chair)"/>
    <!-- Headrest -->
    <rect x="545" y="150" width="45" height="30" rx="8" fill="#134e4a"/>
    <!-- Armrest -->
    <rect x="340" y="320" width="80" height="16" rx="8" fill="#14b8a6"/>
  </g>

  <!-- Dental Overhead Light -->
  <path d="M240 100 Q 320 120 360 180" stroke="#64748b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <ellipse cx="370" cy="190" rx="35" ry="20" fill="#334155"/>
  <ellipse cx="370" cy="190" rx="25" ry="12" fill="#fef08a"/>
  <!-- Light beam -->
  <polygon points="350,200 460,330 380,350 330,200" fill="#fef08a" opacity="0.25"/>

  <!-- Instrument Tray -->
  <path d="M220 360 L 220 450" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <rect x="180" y="340" width="100" height="20" rx="4" fill="#cbd5e1"/>
  <rect x="190" y="330" width="80" height="10" rx="2" fill="#0d9488"/>
</svg>
